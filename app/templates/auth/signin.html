
{% extends "layout.html" %}

{% block content %}
<div class="login-page">
    <div class="login-left">
        Welcome Back!
    </div>
    <div class="login-right">
        <h2>Login Here</h2>
        <form method="POST" action="{{ url_for('login.user_login') }}">
            {{ form.hidden_tag() }}
            <input type="text" name="login" placeholder="Login" required>
            <input type="password" name="password" placeholder="Password" required>
            <label>
                <input type="checkbox" name="stay_logged_in"> Remember me
            </label>
            <button type="submit">Login</button>
        </form>
        

        <div class="social-login">
            <hr class="hr-or">
            <button class="google">
                <img src="{{ url_for('static', filename='google-icon.png') }}" alt="Google" />
                Continue with Google
            </button>
            <button class="twitter">
                <img src="{{ url_for('static', filename='twitter-icon.png') }}" alt="Twitter" />
                Continue with Twitter
            </button>
        </div>
    </div>
</div>
{% endblock content %}
